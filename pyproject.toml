[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kovadapt"
dynamic = ["version"]
description = "Adaptive difficulty engine for KovaaK's: ML-driven scenario regeneration, mouse telemetry analysis, and performance tuning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arjun Pemmasani" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/apemm/KovaaksAdjusted"
Issues = "https://github.com/apemm/KovaaksAdjusted/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13", "psutil>=5.9"]
clips = ["dxcam>=0.0.5", "opencv-python>=4.8"]
ml = ["torch>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["kovadapt[gui,clips,ml]"]

[project.scripts]
kovadapt = "kovadapt.cli:main"

[tool.setuptools.packages.find]
include = ["kovadapt*"]

[tool.setuptools.dynamic]
version = { attr = "kovadapt.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
